name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: llm_agent_mcp-main

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # --legacy-peer-deps: manifest mixes langchain 0.3 (core 0.3.x) with
      # langgraph 1.x / openai 1.x (core 1.x); lock installs deterministically.
      # TODO: align all @langchain/* packages to one core major.
      - run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (unit-only)
        run: npm run test:ci
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/testdb
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: llm_agent_mcp-main/ui/package-lock.json

      - name: Install dependencies
        working-directory: llm_agent_mcp-main/ui
        run: npm ci

      - name: Lint
        working-directory: llm_agent_mcp-main/ui
        # next lint was removed in Next 16; use the eslint script directly.
        # Budget 200: 154 existing warnings.
        run: npm run lint -- --max-warnings=200

      - name: Run frontend tests
        working-directory: llm_agent_mcp-main/ui
        run: npm test

      - name: Build
        working-directory: llm_agent_mcp-main/ui
        run: npm run build
